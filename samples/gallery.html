<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Studio Lumen | Portfolio</title>
  </head>
  <body>
    <header class="studio-header">
      <h1>Studio Lumen</h1>
      <div class="toolbar" role="toolbar" aria-label="View options">
        <button type="button" class="tool" title="Grid view">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
        </button>
        <button type="button" class="tool" title="List view">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <path d="M3 6h.01M3 12h.01M3 18h.01" fill-rule="evenodd" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </header>
    <main class="gallery">
      <figure class="shot">
        <img src="img/harbour-480.jpg" srcset="img/harbour-480.jpg 480w, img/harbour-960.jpg 960w" sizes="(max-width: 600px) 480px, 960px" alt="Fishing boats in a harbour at dawn" loading="lazy" width="480" height="320" />
        <figcaption>Harbour, first light</figcaption>
      </figure>
      <figure class="shot">
        <img src="img/market-480.jpg" srcset="img/market-480.jpg 480w, img/market-960.jpg 960w" sizes="(max-width: 600px) 480px, 960px" alt="A busy covered market" loading="lazy" width="480" height="320" />
        <figcaption>Saturday market</figcaption>
      </figure>
      <figure class="shot">
        <img src="img/workshop-480.jpg" srcset="img/workshop-480.jpg 480w, img/workshop-960.jpg 960w" sizes="(max-width: 600px) 480px, 960px" alt="A carpenter planing a board" loading="lazy" width="480" height="320" />
        <figcaption>The joiner's bench</figcaption>
      </figure>
      <figure class="shot">
        <img src="img/orchard-480.jpg" srcset="img/orchard-480.jpg 480w, img/orchard-960.jpg 960w" sizes="(max-width: 600px) 480px, 960px" alt="Apple trees in blossom" loading="lazy" width="480" height="320" />
        <figcaption>Orchard in May</figcaption>
      </figure>
      <figure class="shot">
        <img src="img/station-480.jpg" srcset="img/station-480.jpg 480w, img/station-960.jpg 960w" sizes="(max-width: 600px) 480px, 960px" alt="An empty railway platform at night" loading="lazy" width="480" height="320" />
        <figcaption>Last train</figcaption>
      </figure>
      <figure class="shot">
        <img src="img/kiln-480.jpg" srcset="img/kiln-480.jpg 480w, img/kiln-960.jpg 960w" sizes="(max-width: 600px) 480px, 960px" alt="A potter opening a kiln" loading="lazy" width="480" height="320" />
        <figcaption>Opening the kiln</figcaption>
      </figure>
    </main>
    <footer class="studio-footer">
      <p>All photographs &copy; Studio Lumen. Prints available on request.</p>
    </footer>
  </body>
</html>
